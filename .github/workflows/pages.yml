# GitHub Pages: reference manual (FR/EN), install page and the signed update channel (ARCHITECTURE §17).
# The site plays no part in synchronisation. Built from the repository with stdlib Python + node (maths pre-rendered);
# no secret is used. Pages must be enabled by the repository owner (Settings › Pages › Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]          # the github-pages environment only accepts main (a tag run always failed)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the site
        run: scripts/build_site.sh --ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
