[pytest]
testpaths = tests
norecursedirs = legacy data __pycache__
markers =
    slow: needs a real model, llama-server and the GPU (minutes)
    online: needs Internet and API keys (brain session S-B)
    sage: real sandboxed Sage / Python kernels (runs whenever sage + jupyter-lab are installed; S-AC smoke suite)
filterwarnings =
    ignore:It is recommended to use web.RequestKey
addopts = -q
