# Madalean 2.0 — every external component, pinned (ARCHITECTURE §18). Read by madalean.deps (installer, health,
# `deps` update checker) and by install.sh. Updated only through a Madalean release (this file is part of the
# signed package): a new pin = new version + SHA-256 here, then the update system installs it (verify → switch).
#
# need: required | optional | on-demand        kind: binary | archive | conda-env | tectonic-bundle | build
# sha256 / size: of the downloaded file. For conda envs, `sha256` is the SHA-256 of the lock file; each package of
# the lock carries its own URL + SHA-256 (checked against conda-meta after the install), `size` = sum of the
# package files (bytes downloaded), `installed_size` = measured size on disk (2026-11-21, this machine).
schema = 1

