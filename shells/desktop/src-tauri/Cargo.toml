[package]
name = "madalean-desktop"
version = "2.0.0"
description = "Madalean desktop shell: connects to the Madalean host and shows its web UI"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[lib]
name = "madalean_desktop"
crate-type = ["rlib"]

[[bin]]
name = "madalean"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
url = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
gethostname = "1.1"
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
