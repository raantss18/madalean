name: madalean_shell
description: Madalean thin client for Android (connects to the Madalean host, pairing, web view).
version: 2.0.3+4
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  app_links: ^7.2.2
  crypto: 3.0.6
  cryptography: 2.9.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
